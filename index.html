  <body>
    <!-- Conteúdo para quem NÃO executa JavaScript: rastreadores de IA
         (GPTBot, ClaudeBot, PerplexityBot) em geral não executam, e veriam
         uma página vazia. Aqui eles leem a proposta de verdade. -->
    <noscript>
      <div style="max-width:44rem;margin:0 auto;padding:2rem 1.25rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>Eleva — educação de produto que vende na ponta</h1>
        <p>
          O Eleva é um programa white-label de educação de produto para a força de venda de
          marcas farmacêuticas e de suplementos. Cada produto vira uma pílula curta em vídeo,
          com o benefício, a resposta pronta para cada objeção da cliente e a mensagem para
          enviar no WhatsApp.
        </p>
        <h2>Para quem</h2>
        <p>Balconista de farmácia, afiliado, promotor e profissional da saúde — cada um recebe o conteúdo feito para ele.</p>
        <h2>O que o programa entrega</h2>
        <ul>
          <li>Pílula em vídeo por produto, com benefício e linha de venda</li>
          <li>Quebra de objeção pronta para enviar no WhatsApp</li>
          <li>Vídeo diferente por público no mesmo produto</li>
          <li>Quiz e certificado da marca</li>
          <li>Painel para o gestor acompanhar o time</li>
          <li>Cor, nome e catálogo da marca contratante</li>
        </ul>
        <p>Marcas que usam hoje: Meraki (linha GLPEN Nutri e Hyaluvita) e Sorocaps · Drogaria São Paulo.</p>
        <p>Contato: viviangitti23@gmail.com · <a href="/eleva/privacidade">Política de Privacidade</a></p>
        <p><b>Este site precisa de JavaScript para funcionar. Ative-o para entrar no programa.</b></p>
      </div>
    </noscript>
    <div id="root"></div>
    <script>
      // Força atualização do service worker quando nova versão está disponível
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(reg => {
          if (reg) {
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    window.location.reload();
                  }
                });
              }
            });
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
