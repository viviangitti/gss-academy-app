<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e" />
      <stop offset="50%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#252547" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b96a" />
      <stop offset="100%" stop-color="#a88936" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <text x="256" y="288" font-family="'Cinzel', Georgia, serif" font-size="128" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="2" filter="url(#glow)">GSS</text>
  <text x="256" y="392" font-family="'Cinzel', Georgia, serif" font-size="38" font-weight="700" fill="#c9a84c" text-anchor="middle" letter-spacing="8">ELEVA</text>
</svg>
